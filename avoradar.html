<title>🥑 アボちゃん</title>
<style>
:root {
  --green:   #44cc22;
  --dark:    #0a1a0a;
  --darker:  #050e05;
  --panel:   #111e11;
  --text:    #d0ffd0;
  --muted:   #6a9a6a;
  --accent:  #a8ffb0;
  --warn:    #ffcc44;
  --danger:  #ff6644;
}
* { box-sizing: border-box; margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%; background: var(--darker);
  font-family: -apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif;
  overflow: hidden; color: var(--text);
}
#app { width: 100%; height: 100%; position: relative; overflow: hidden; }

/* ── screens ── */
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: env(safe-area-inset-top, 20px) 0
            env(safe-area-inset-bottom, 20px);
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.screen.active { opacity: 1; pointer-events: all; }

/* ── home ── */
#home { background: var(--darker); gap: 0; }
#home-logo {
  font-size: 80px; line-height: 1;
  margin-bottom: 4px;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-10px); }
}
#home-title {
  font-size: 34px; font-weight: 700; letter-spacing: 0.04em;
  color: var(--accent); margin-bottom: 4px;
}
#home-sub {
  font-size: 14px; color: var(--muted); margin-bottom: 36px;
  letter-spacing: 0.05em;
}
#home .sparkle {
  position: absolute; font-size: 12px; color: var(--green);
  animation: twinkle 2s ease-in-out infinite;
  pointer-events: none;
}
@keyframes twinkle {
  0%,100% { opacity: 0.2; transform: scale(0.8); }
  50%      { opacity: 1;   transform: scale(1.2); }
}
#start-btn {
  background: var(--green); color: #0a2a0a;
  border: none; border-radius: 50px;
  padding: 18px 52px; font-size: 20px; font-weight: 700;
  cursor: pointer; letter-spacing: 0.05em;
  transition: transform 0.12s, opacity 0.12s;
}
#start-btn:active { transform: scale(0.95); opacity: 0.85; }
#home-disclaimer {
  margin-top: 20px; font-size: 11px; color: var(--muted);
  opacity: 0.6;
}
#install-hint {
  position: absolute; bottom: calc(env(safe-area-inset-bottom, 16px) + 16px);
  left: 16px; right: 16px;
  background: rgba(0,30,0,0.92); border: 1px solid var(--green);
  border-radius: 14px; padding: 14px 16px;
  display: none;
}
#install-hint.show { display: block; }
#install-hint-title {
  font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 6px;
}
#install-hint-body {
  font-size: 13px; color: var(--text); line-height: 1.7;
}
#install-hint-close {
  position: absolute; top: 10px; right: 14px;
  font-size: 18px; color: var(--muted); background: none; border: none;
  cursor: pointer; color: var(--muted);
}

/* ── camera ── */
#camera-screen { background: #000; padding: 0; justify-content: flex-end; }
#video {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
}
#scan-overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
}
#scan-frame {
  width: min(70vw, 280px); aspect-ratio: 1;
  position: relative;
}
.corner {
  position: absolute; width: 24px; height: 24px;
  border-color: var(--green); border-style: solid;
}
.corner.tl { top:0;left:0;  border-width:3px 0 0 3px; border-radius:4px 0 0 0; }
.corner.tr { top:0;right:0; border-width:3px 3px 0 0; border-radius:0 4px 0 0; }
.corner.bl { bottom:0;left:0;  border-width:0 0 3px 3px; border-radius:0 0 0 4px; }
.corner.br { bottom:0;right:0; border-width:0 3px 3px 0; border-radius:0 0 4px 0; }
#scan-line {
  position: absolute; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--green), transparent);
  top: 0; animation: scan 2s linear infinite;
}
@keyframes scan { 0%{top:0%} 100%{top:100%} }
#scan-hint {
  position: absolute; bottom: -28px; left: 0; right: 0;
  text-align: center; font-size: 13px; color: rgba(170,255,170,0.7);
}

#cam-bottom {
  position: relative; z-index: 10;
  width: 100%; padding: 16px 24px 28px;
  display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(transparent, rgba(0,0,0,0.8));
}
#cam-avo {
  width: 52px; height: 52px;
  display: flex; align-items: center; justify-content: center;
}
#cam-avo svg { width: 52px; height: 60px; }
#shutter {
  width: 72px; height: 72px; border-radius: 50%;
  background: transparent; border: 3px solid var(--green);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: transform 0.1s, background 0.1s;
}
#shutter:active { transform: scale(0.9); background: rgba(68,204,34,0.2); }
#shutter-inner {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--green);
}
#flash-btn {
  width: 52px; height: 52px; border-radius: 50%;
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 22px; transition: background 0.15s;
}
#flash-btn.on { background: rgba(255,220,80,0.3); border-color: #ffcc44; }
#flash-btn:active { background: rgba(255,255,255,0.2); }
#no-cam {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; background: var(--darker);
  font-size: 15px; color: var(--muted); text-align: center;
  padding: 2rem; display: none;
}
#no-cam.show { display: flex; }
#no-cam-icon { font-size: 48px; }

/* ── analyzing ── */
#analyzing { background: var(--darker); gap: 20px; }
#analyzing-avo { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.08); }
}
#analyzing-label {
  font-size: 22px; font-weight: 700; color: var(--accent);
  letter-spacing: 0.1em;
}
#dots { display: flex; gap: 8px; }
.dot {
  width: 10px; height: 10px; border-radius: 50%; background: var(--green);
  animation: blink 1.2s ease-in-out infinite;
}
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink {
  0%,100% { opacity: 0.2; } 50% { opacity: 1; }
}

/* ── result ── */
#result-screen { background: var(--darker); gap: 16px; }
#result-screen.bg-fresh   { background: #051a05; }
#result-screen.bg-almost  { background: #091509; }
#result-screen.bg-peak    { background: #0a1a0a; }
#result-screen.bg-over    { background: #1a1a05; }
#result-screen.bg-rotten  { background: #1a0505; }

#result-stage {
  font-size: 28px; font-weight: 700; letter-spacing: 0.08em;
}
#result-avo { transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1); }
#result-avo.pop { transform: scale(1.15); }
#result-line {
  font-size: 22px; font-weight: 500; text-align: center;
  line-height: 1.5; padding: 0 32px; color: var(--accent);
  min-height: 66px;
}
#result-disclaimer {
  font-size: 11px; color: var(--muted); opacity: 0.6;
}
#result-btns {
  display: flex; gap: 14px; margin-top: 8px;
}
.r-btn {
  padding: 14px 24px; border-radius: 50px;
  font-size: 16px; font-weight: 700; cursor: pointer;
  border: 2px solid var(--green); color: var(--green);
  background: transparent; letter-spacing: 0.04em;
  transition: transform 0.1s, background 0.12s;
}
.r-btn:active { transform: scale(0.95); }
.r-btn.primary {
  background: var(--green); color: #0a2a0a; border-color: var(--green);
}
.r-btn.speak { border-color: var(--accent); color: var(--accent); }
.r-btn.speak.speaking { background: rgba(168,255,176,0.15); }
</style>
</head>
<body>

<script>
var isIOS     = /iphone|ipad|ipod/i.test(navigator.userAgent);
var isAndroid = /android/i.test(navigator.userAgent);
var isStandalone = window.navigator.standalone
                || window.matchMedia('(display-mode: standalone)').matches;

(function(){
  if (isStandalone) return;
  var seen = false;
  try { seen = !!localStorage.getItem('avo_hint_seen'); } catch(e){}
  if (seen) return;
  try { localStorage.setItem('avo_hint_seen','1'); } catch(e){}

  var hint = document.getElementById('install-hint');
  var body = document.getElementById('install-hint-body');
  if (isIOS) {
    body.innerHTML = '① 画面下の <strong style="color:#88aaff">共有ボタン</strong>（四角から矢印が出たアイコン）をタップ<br>② 「<strong style="color:#88aaff">ホーム画面に追加</strong>」を選ぶ<br>③ 右上の「<strong style="color:#88aaff">追加</strong>」をタップ';
  } else if (isAndroid) {
    body.innerHTML = '① 右上の <strong style="color:#88aaff">︙ メニュー</strong> をタップ<br>② 「<strong style="color:#88aaff">ホーム画面に追加</strong>」または<br>　「<strong style="color:#88aaff">アプリをインストール</strong>」を選ぶ';
  } else {
    return;
  }
  setTimeout(function(){ hint.classList.add('show'); }, 1200);

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    var btn = document.createElement('button');
    btn.className = 'r-btn primary';
    btn.style.cssText = 'margin-top:10px;width:100%;font-size:14px;padding:10px';
    btn.textContent = '📲 インストール';
    btn.onclick = function(){ e.prompt(); };
    body.appendChild(btn);
  });
})();

var stream = null;
var flashOn = false;
var currentResult = null;

var STAGES = [
  {
    id: 'fresh',
    label: '🌿 未熟',
    line: 'まだですよ。\n焦りは禁物。',
    voice: 'まだですよ。焦りは禁物。',
    bg: 'bg-fresh',
    rate: 0.9, pitch: 1.0,
    avoBg: '#3a7a20', fleshColor: '#b0cc50', pitColor: '#7a3a0e',
    eyeMood: 'stern'
  },
  {
    id: 'almost',
    label: '🕐 もうすぐ',
    line: 'もうすぐです！\nあと少しだけ待って！',
    voice: 'もうすぐです！あと少しだけ待って！',
    bg: 'bg-almost',
    rate: 1.0, pitch: 1.1,
    avoBg: '#2d5a1a', fleshColor: '#c8e870', pitColor: '#8a4010',
    eyeMood: 'hopeful'
  },
  {
    id: 'peak',
    label: '🌟 今が食べ頃！',
    line: '今が食べ頃、美味しいよ！\n最高の瞬間をお楽しみに！',
    voice: '今が食べ頃、美味しいよ！最高の瞬間をお楽しみに！',
    bg: 'bg-peak',
    rate: 1.3, pitch: 1.3,
    avoBg: '#2a5218', fleshColor: '#d8f080', pitColor: '#8a3e0c',
    eyeMood: 'excited'
  },
  {
    id: 'over',
    label: '⚠️ ピーク過ぎ',
    line: '急いでください…\n時間がないんです…',
    voice: '急いでください…時間がないんです…',
    bg: 'bg-over',
    rate: 1.1, pitch: 0.95,
    avoBg: '#3a3a18', fleshColor: '#b8c858', pitColor: '#6a3008',
    eyeMood: 'worried'
  },
  {
    id: 'rotten',
    label: '💀 腐敗気味',
    line: '…諦めろ。',
    voice: '…諦めろ。',
    bg: 'bg-rotten',
    rate: 0.7, pitch: 0.7,
    avoBg: '#2a2a10', fleshColor: '#888844', pitColor: '#5a2a04',
    eyeMood: 'dead'
  }
];

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById(id === 'camera' ? 'camera-screen'
    : id === 'analyzing' ? 'analyzing'
    : id === 'result'   ? 'result-screen'
    : 'home').classList.add('active');
}

async function startCamera() {
  showScreen('camera');

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showCamError('このブラウザはカメラに対応していません。SafariでURLを直接開いてください。');
    return;
  }

  var constraints = [
    { video: { facingMode: { exact: 'environment' } }, audio: false },
    { video: { facingMode: 'environment' }, audio: false },
    { video: true, audio: false }
  ];

  for (var i = 0; i < constraints.length; i++) {
    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints[i]);
      var video = document.getElementById('video');
      video.srcObject = stream;
      await video.play();
      return;
    } catch(e) {
      if (i === constraints.length - 1) {
        var msg = e.name === 'NotAllowedError'
          ? 'カメラの使用が許可されていません。\n設定 → Safari → カメラ → 許可する\nを確認してください。'
          : 'カメラを起動できませんでした（' + e.name + '）。\nSafariのアドレスバーからURLを直接開いてみてください。';
        showCamError(msg);
      }
    }
  }
}

function showCamError(msg) {
  var el = document.getElementById('no-cam');
  el.querySelector('div:nth-child(2)').innerText = msg;
  el.classList.add('show');
}

function toggleFlash() {
  flashOn = !flashOn;
  var btn = document.getElementById('flash-btn');
  btn.classList.toggle('on', flashOn);
  if (stream) {
    var track = stream.getVideoTracks()[0];
    if (track && track.getCapabilities && track.getCapabilities().torch) {
      track.applyConstraints({ advanced: [{ torch: flashOn }] }).catch(function(){});
    }
  }
}

function capture() {
  var video = document.getElementById('video');
  var canvas = document.getElementById('canvas');
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  var ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);

  var result = analyzeFrame(ctx, canvas.width, canvas.height);
  showAnalyzing(result);
}

function analyzeFrame(ctx, w, h) {
  var cx = Math.floor(w / 2);
  var cy = Math.floor(h / 2);
  var size = Math.floor(Math.min(w, h) * 0.25);
  var data = ctx.getImageData(cx - size, cy - size, size * 2, size * 2).data;

  var totalR = 0, totalG = 0, totalB = 0, count = 0;
  for (var i = 0; i < data.length; i += 4) {
    totalR += data[i];
    totalG += data[i+1];
    totalB += data[i+2];
    count++;
  }
  var r = totalR / count;
  var g = totalG / count;
  var b = totalB / count;

  var hsv = rgbToHsv(r, g, b);
  var h = hsv[0], s = hsv[1], v = hsv[2];

  var idx;
  if (s < 0.12) {
    idx = 4;
  } else if (v < 0.18) {
    idx = 3;
  } else if (h >= 50 && h < 130) {
    // 緑系：明るい=未熟、中間=もうすぐ、暗め=食べ頃
    if (v > 0.60) idx = 0;
    else if (v > 0.38) idx = 1;
    else idx = 2;
  } else if (h >= 20 && h < 50) {
    // 黄〜茶系：明るい=もうすぐ、中間=食べ頃、暗い=ピーク過ぎ
    if (v > 0.55) idx = 1;
    else if (v > 0.30) idx = 2;
    else idx = 3;
  } else if (h < 20 || h >= 330) {
    idx = (v < 0.30) ? 3 : 4;
  } else {
    idx = Math.floor(Math.random() * 3) + 1;
  }

  var nudge = Math.random();
  if (nudge < 0.12) idx = Math.max(0, idx - 1);
  else if (nudge > 0.88) idx = Math.min(4, idx + 1);

  return STAGES[idx];
}

function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  var max = Math.max(r,g,b), min = Math.min(r,g,b), d = max - min;
  var h = 0, s = (max === 0) ? 0 : d / max, v = max;
  if (d !== 0) {
    if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
    else if (max === g) h = ((b - r) / d + 2) / 6;
    else h = ((r - g) / d + 4) / 6;
  }
  return [h * 360, s, v];
}

function showAnalyzing(result) {
  currentResult = result;
  showScreen('analyzing');
  setTimeout(function(){ showResult(result); }, 1800);
}

function showResult(stage) {
  var rs = document.getElementById('result-screen');
  rs.className = 'screen active ' + stage.bg;

  document.getElementById('result-stage').textContent = stage.label;
  document.getElementById('result-line').textContent  = stage.line;
  document.getElementById('result-avo').innerHTML     = buildAvoSvg(stage);

  showScreen('result');

  setTimeout(function(){
    var avo = document.getElementById('result-avo');
    avo.classList.add('pop');
    setTimeout(function(){ avo.classList.remove('pop'); }, 400);
  }, 100);

  setTimeout(function(){ speakResult(); }, 500);
}

function speakResult() {
  if (!currentResult) return;
  var synth = window.speechSynthesis;
  if (synth.speaking) synth.cancel();

  var utter = new SpeechSynthesisUtterance(currentResult.voice);
  utter.lang  = 'ja-JP';
  utter.rate  = currentResult.rate;
  utter.pitch = currentResult.pitch;

  var btn = document.getElementById('speak-btn');
  btn.textContent = '🔊 再生中…';
  btn.classList.add('speaking');
  utter.onend = function(){
    btn.textContent = '🔊 もう一度';
    btn.classList.remove('speaking');
  };
  synth.speak(utter);
}

function retake() {
  var synth = window.speechSynthesis;
  if (synth.speaking) synth.cancel();
  if (stream) {
    showScreen('camera');
  } else {
    startCamera();
  }
}

      var newWorker = reg.installing;
      newWorker.addEventListener("statechange", function() {
        if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
          newWorker.postMessage({ action: "skipWaiting" });
        }
      });
    });
  });
  navigator.serviceWorker.addEventListener("controllerchange", function() {
    window.location.reload();
  });
}
</script>
